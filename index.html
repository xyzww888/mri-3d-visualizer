<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="联影医疗 UNITED IMAGING uMR Omega 3.0T 75cm 超大孔径磁共振高保真 3D 工业设计可视化系统"
    />
    <title>UNITED IMAGING · uMR Omega 3.0T | 3D Industrial Showcase</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/assets/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="webgl"></canvas>

      <!-- Minimalist Apple / UIH Frosted Glass Top Bar -->
      <header class="hud-header">
        <div class="hud-brand">
          <div class="hud-logo" aria-hidden="true">
            <svg viewBox="0 0 40 48" width="20" height="24">
              <path
                d="M4 2h13v29a3 3 0 0 0 6 0V21h13v9C36 40 28.8 46 20 46S4 40 4 30V2zm19 0h13v14H23V2z"
                fill="currentColor"
              />
            </svg>
          </div>
          <div class="hud-title-group">
            <h1>UNITED IMAGING · uMR Omega</h1>
            <p>3.0T · 75cm Ultra-Wide Bore · uAIFI Inside</p>
          </div>
        </div>

        <div class="hud-status">
          <span id="model-source-badge" class="badge badge-success">
            <span class="badge-dot"></span>
            <span id="model-source-text">正在载入模型...</span>
          </span>
        </div>
      </header>

      <!-- Minimalist Left Control Dock -->
      <aside class="hud-sidebar">
        <div class="sidebar-section">
          <h3>视角 (Views)</h3>
          <div class="view-buttons">
            <button id="view-perspective" class="btn btn-view active" data-view="perspective">左前经典</button>
            <button id="view-front" class="btn btn-view" data-view="front">正面对称</button>
            <button id="view-bore" class="btn btn-view" data-view="bore">75cm 孔径</button>
            <button id="view-bed" class="btn btn-view" data-view="bed">纯白床台</button>
            <button id="view-cryo" class="btn btn-view" data-view="cryo">右前透视</button>
            <button id="view-top" class="btn btn-view" data-view="top">俯视轮廓</button>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>交互与剖析 (Controls)</h3>
          <div class="action-buttons">
            <button id="btn-toggle-bed" class="btn btn-primary">
              <span id="bed-btn-text">推进检查床 (进孔)</span>
            </button>
            <button id="btn-toggle-coils" class="btn btn-outline">
              <span>装配 uAIFI 射频线圈</span>
            </button>
            <button id="btn-toggle-cutaway" class="btn btn-outline">
              <span>97cm 超导磁体透视</span>
            </button>
            <button id="btn-toggle-laser" class="btn btn-outline">
              <span>激光十字定位准直</span>
            </button>
            <button id="btn-toggle-annotations" class="btn btn-outline">
              <span>显示部件工程标号</span>
            </button>
            <button id="btn-toggle-studio" class="btn btn-outline">
              <span id="studio-btn-text">切换星空暗场模式</span>
            </button>
            <button id="btn-toggle-wireframe" class="btn btn-outline">
              <span>拓扑线框检视</span>
            </button>
          </div>
        </div>

        <div class="sidebar-section">
          <p class="sidebar-tip">
            左键旋转 · 滚轮缩放 · 右键平移
          </p>
        </div>
      </aside>

      <!-- 3D Annotations Layer -->
      <div id="annotations-container" class="annotations-overlay"></div>

      <!-- Minimalist Spec Sheet Card -->
      <div id="info-modal" class="info-card hidden">
        <button id="btn-close-modal" class="close-btn" aria-label="关闭">&times;</button>
        <div class="info-tag" id="info-tag">工业规格</div>
        <h2 id="info-title">部件名称</h2>
        <p id="info-desc">功能说明</p>
        <div class="info-specs" id="info-specs"></div>
      </div>

      <!-- Clean Gallery Loading Screen -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-card">
          <div class="loading-spinner"></div>
          <h2>UNITED IMAGING · uMR Omega</h2>
          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <p id="loading-text" class="loading-sub">正在载入 3D 工业模型...</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
